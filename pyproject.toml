[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiostar-contract-assistant"
version = "0.1.0"
description = "Offset-preserving contract passage retrieval benchmark"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.30,<2"]

[project.scripts]
contract-search = "contract_assistant.cli:main"
contract-download = "contract_assistant.download_data:main"
contract-improve = "contract_assistant.improve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
